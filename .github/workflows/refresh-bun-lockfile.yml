name: Refresh Bun lockfile

on:
  push:
    branches:
      - strategy/lead-capture-audit
    paths:
      - package.json
      - bun.lock

permissions:
  contents: write

concurrency:
  group: bun-lock-refresh-strategy-lead-capture-audit
  cancel-in-progress: false

jobs:
  refresh-lockfile:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: strategy/lead-capture-audit
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9
      - name: Regenerate lockfile
        run: bun install --lockfile-only --ignore-scripts
      - name: Commit lockfile if changed
        run: |
          if ! git diff --quiet -- bun.lock; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add bun.lock
            git commit -m "chore: refresh Bun lockfile for TanStack security fix"
            git push origin HEAD:strategy/lead-capture-audit
          fi
